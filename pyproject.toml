[project]
name = "nightwatch"
version = "0.1.0"
description = "NightWatch — Async incident triage & root-cause analysis backend with Hybrid RAG, ARQ, Redis, pgvector, and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.5",
    "redis>=5.1.0",
    "arq>=0.26.0",
    "httpx>=0.27.0",
    "sentence-transformers>=3.1.0",
    "mcp>=1.1.0",
    "google-genai>=0.3.0",
    "aiogram>=3.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

